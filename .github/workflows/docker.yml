# MjengoOS — Dockerfile verification (webapp + marketing site) + container
# smoke test (issue #198, audit INF-4).
# GitHub-hosted runners ship Docker, so `docker build` here is the REAL
# verification of the production images (the dev sandbox has no docker CLI) —
# and the `smoke` job below then BOOTS what was built: compose-up of the app
# + website images with dummy secrets on a throwaway SQLite volume, a bounded
# poll of GET /api/health until {"ok":true,"db":"up"} (a 200 from that route
# requires the migrate-on-boot CMD to have applied the schema — the
# load-bearing path this protects; the bug class of issue #73), an explicit
# prisma success-line assertion from the boot log, and a /website probe
# through the app's WEBSITE_ORIGIN rewrite. No registry push (image
# publishing is INF-12's scope — see .github/workflows/publish.yml, issue #209).
name: Docker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build:
    name: docker build (image verification)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t mjengoos-ci .

  website-build:
    name: docker build (marketing site image verification)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build marketing site image
        run: docker build -t mjengoos-website-ci ./mjengoos-website

  # ───────────────────────────────────────────────────────────────────────
  # Smoke test (issue #198, audit INF-4): boot what we build.
  #
  # A green `docker build` proves the image compiles — not that the app
  # starts, migrations apply, or /api/health answers. The image's boot path
  # is load-bearing: CMD = `prisma migrate deploy && exec node server.js`
  # (Dockerfile) runs on every container start, so a migration/file-layout
  # regression builds fine and bricks on boot (issue #73 lived exactly this).
  #
  # Design notes:
  #   · Reuses docker-compose.yml by naming the services (`up app website` —
  #     jobs-tick is never started, and there are no depends_on deps): the
  #     compose file's fail-closed ${NEXTAUTH_SECRET:?} interpolation doubles
  #     as a secret-presence check for free, and the job exercises the same
  #     healthcheck/WEBSITE_ORIGIN wiring a real deployment uses.
  #   · GitHub-hosted runners do NOT share Docker state between jobs, so this
  #     job rebuilds both images under the tags compose expects (`mjengoos`,
  #     `mjengoos-website`) and boots them with --no-build. A registry or
  #     artifact hand-off would avoid the rebuild — that is INF-12's scope,
  #     not this issue's; the rebuild costs a few minutes and keeps the
  #     workflow registry-free. `needs` both build jobs so a red build skips
  #     the smoke run instead of re-failing identically here.
  #   · The named volumes (app-db etc.) are throwaway: created by `up`,
  #     removed (-v) by the always-run teardown step.
  #   · First actual execution rides the first green run after the Actions
  #     billing lock (#98) is lifted — every step here is written for that
  #     day: bounded probes, log-dump diagnostics, guaranteed teardown.
  # ───────────────────────────────────────────────────────────────────────
  smoke:
    name: smoke (compose-up + /api/health + /website probe)
    runs-on: ubuntu-latest
    needs: [docker-build, website-build]
    # The probes are bounded (120s + 60s); the cap exists so a hung build or
    # compose-up can never burn a stuck 6h default run on a billing-locked
    # account.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build app image (compose's expected tag)
        run: docker build -t mjengoos .

      - name: Build marketing site image (compose's expected tag)
        run: docker build -t mjengoos-website ./mjengoos-website

      - name: Boot the stack (app + website, dummy secrets, throwaway volumes)
        env:
          # Dummy, never real — same pattern as the ci.yml build job. 49
          # chars ≥ the 32-char minimum the production boot guard enforces
          # (src/backend/lib/next-auth-guard.ts); compose's fail-closed
          # ${NEXTAUTH_SECRET:?} interpolation aborts `up` if it ever goes
          # missing.
          NEXTAUTH_SECRET: ci-smoke-dummy-secret-0123456789abcdef-never-real
        run: |
          # compose's env_file requires .env to exist; the runner checkout
          # has none. Write ONLY the dummy secret into it (DATABASE_URL and
          # the rest come from compose's environment block, exactly like a
          # real deployment minus the optional secrets).
          printf 'NEXTAUTH_SECRET=%s\n' "$NEXTAUTH_SECRET" > .env
          docker compose up -d --no-build app website

      - name: Probe GET /api/health until ok+db:up (120s budget)
        run: |
          set -eu
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            body="$(curl -fsS --max-time 5 http://localhost:3000/api/health 2>/dev/null || true)"
            if [ -n "$body" ] && printf '%s' "$body" | jq -e '.ok == true and .db == "up"' >/dev/null 2>&1; then
              echo "smoke: /api/health is green after ${SECONDS}s:"
              printf '%s\n' "$body" | jq .
              exit 0
            fi
            sleep 3
          done
          echo "::error::smoke: /api/health did not report {\"ok\":true,\"db\":\"up\"} within 120s"
          echo "::group::docker compose ps -a (container + healthcheck state)"
          docker compose ps -a || true
          echo "::endgroup::"
          echo "::group::app container logs (migrate deploy + boot output)"
          docker compose logs --no-color app || true
          echo "::endgroup::"
          exit 1

      # Explicit migration assertion (issue AC): a 200 from /api/health
      # already implies migrate-on-boot succeeded — the route answers 503
      # db:"down" when the tables are missing — but assert prisma's own
      # success line from the boot log too. Prisma 6.x prints "All
      # migrations have been successfully applied." on a fresh DB (the
      # throwaway-volume case here) or "No pending migrations to apply."
      # when already up to date; the older "N migrations successfully
      # applied." wording also matches.
      - name: Assert migrate-on-boot succeeded (prisma success line in boot log)
        run: |
          set -eu
          docker compose logs --no-color app > /tmp/smoke-app-boot.log 2>&1
          echo "::group::app boot log (full)"
          cat /tmp/smoke-app-boot.log
          echo "::endgroup::"
          if ! grep -Eq 'successfully applied|No pending migrations to apply' /tmp/smoke-app-boot.log; then
            echo "::error::smoke: no prisma migrate-deploy success line in the boot log — migrations did not run on boot"
            exit 1
          fi
          echo "smoke: migrate-on-boot confirmed (prisma success line present in boot log)"

      # Stretch AC (done): the two-app wiring — GET /website through the
      # app's WEBSITE_ORIGIN rewrite (next.config.ts) to the website
      # container. -L because a basePath redirect would otherwise surface
      # as its 3xx code; the end-user view is "the page loads".
      - name: Probe GET /website through the app rewrite (60s budget)
        run: |
          set -eu
          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            code="$(curl -sL -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:3000/website || true)"
            if [ "$code" = "200" ]; then
              echo "smoke: /website (app → website rewrite) answers 200 after ${SECONDS}s"
              exit 0
            fi
            echo "smoke: /website not ready yet (HTTP ${code:-000}) - retrying in 3s"
            sleep 3
          done
          echo "::error::smoke: /website (app → website rewrite) did not answer 200 within 60s"
          echo "::group::website container logs"
          docker compose logs --no-color website || true
          echo "::endgroup::"
          exit 1

      # Diagnostics for ANY failed step above (the probe steps dump their
      # own target's logs on timeout; this covers boot failures and the
      # migrate assertion too — "retry loop expired" alone is not a
      # diagnosis).
      - name: Dump stack state + container logs (failure diagnostics)
        if: failure()
        run: |
          set -eu
          echo "::group::docker compose ps -a"
          docker compose ps -a || true
          echo "::endgroup::"
          for svc in app website; do
            echo "::group::${svc} logs (timestamps)"
            docker compose logs --no-color --timestamps "$svc" || true
            echo "::endgroup::"
          done

      # Runner hygiene: containers + named volumes (the throwaway SQLite
      # volume included) always go away — green, red or cancelled.
      - name: Teardown (always)
        if: always()
        run: docker compose down -v --remove-orphans
