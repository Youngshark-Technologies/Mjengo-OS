# MjengoOS — Vitest unit suite (Task 5-e).
# Real invariant tests over the shared permission matrix, the client-action
# allowlist, i18n dictionaries, rate limiting, the 3-way invoice match and the
# double-entry ledger. Runs on every push/PR to main; no database or secrets
# required — the tests are pure/unit-level by design.
# Issue #185: the run is coverage-enabled (`bun run test:coverage` — provider
# v8, text + lcov) and enforces the per-module floor thresholds documented in
# vitest.config.mts for the critical modules (money path, sync/outbox core,
# guard/auth seams). The lcov report is uploaded as an artifact for every run
# (also once #98's billing lock lifts and jobs actually start).
name: Tests

# WORKFLOWS SUSPENDED (2026-10-13): GitHub Actions is billing-locked
# account-wide (#98, owner action pending). Every automatic run fails at
# startup in 3-9s, so push/PR triggers are parked to keep the Actions tab
# clean and avoid failed-run noise. Manual workflow_dispatch stays wired.
# To restore: uncomment the original trigger block once #98 is resolved.
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Vitest unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Plain `bun run test` remains the fast local gate; CI runs the same
      # suite with coverage so the floors are enforced where merges happen.
      # Measured delta on main @b035c74: 129.5s -> 143.2s (+11%), well inside
      # the 10-minute timeout with fileParallelism: false.
      - name: Run tests (vitest run --coverage)
        run: bun run test:coverage

      # Coverage report artifact (issue #185): lcov + the text summary land in
      # coverage/ — harmless when empty (if-no-files-found: warn), so this
      # step never masks a test failure. The floors themselves fail the run
      # above, not the upload.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
