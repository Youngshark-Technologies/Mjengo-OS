# MjengoOS — quality + build gates.
# quality: ESLint + `tsc --noEmit` (root webapp AND marketing site) on a fresh
#   checkout (next-env.d.ts and .next/types are gitignored + generated;
#   verified locally that tsc passes without them, so no typegen step is
#   needed) + an informational `bun audit` (non-blocking: known dev-toolchain
#   advisories must not fail CI; runtime deps ship in the Docker image).
# build: real `next build` (standalone output) with a throwaway SQLite URL +
#   dummy secret — the production build must never require real env secrets.
name: CI

# WORKFLOWS SUSPENDED (2026-10-13): GitHub Actions is billing-locked
# account-wide (#98, owner action pending). Every automatic run fails at
# startup in 3-9s, so push/PR triggers are parked to keep the Actions tab
# clean and avoid failed-run noise. Manual workflow_dispatch stays wired.
# To restore: uncomment the original trigger block once #98 is resolved.
# on:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

# One run per ref; newer pushes to a PR cancel the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (eslint .)
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bunx tsc --noEmit

      # Marketing site lives in the same repo — its gates run too.
      # (Separate package + lockfile → separate install.)
      - name: Install website dependencies (mjengoos-website)
        run: cd mjengoos-website && bun install --frozen-lockfile

      - name: Website lint (mjengoos-website)
        run: bun run site:lint

      - name: Website typecheck (mjengoos-website)
        run: bun run site:typecheck

      # Informational only: the runtime image ships no dev toolchain, so
      # dev-chain advisories (eslint/babel/etc.) are tracked, not blocking.
      - name: Dependency audit (informational)
        run: bun audit
        continue-on-error: true

  build:
    name: Next.js production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Idempotent: bun install may already generate the client via prisma's
      # install hooks — the explicit step guarantees it before `next build`.
      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Build (standalone)
        run: bun run build
        env:
          DATABASE_URL: "file:ci.db"
          NEXTAUTH_SECRET: "ci-dummy-secret-0123456789abcdef-never-real"
          NEXT_TELEMETRY_DISABLED: "1"
