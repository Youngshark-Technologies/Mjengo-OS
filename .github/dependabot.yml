# Dependency advisory & update watch — issue #173 (root tree + Actions:
# the next-auth pin watch) extended by issue #216 (website tree + wiring to
# the repo's labels/commit conventions). ADR 0007:
# docs/adr/0007-nextauth-v5-migration.md.
#
# Scope: BOTH package trees — the app at / and the marketing site in
# mjengoos-website/, each with its own package.json + bun.lock — plus the
# GitHub Actions workflows under .github/workflows/.
#
# Cadence: weekly, with minor+patch updates grouped into one PR per tree.
# Security advisories are NOT subject to groups or schedules — Dependabot
# opens those PRs immediately, which is the next-auth advisory watch this
# file exists for (next-auth is pinned to an exact 4.24.15 per ADR 0007 and
# is deliberately excluded from the root group so every proposed bump —
# patch or major — arrives as its own immediately-reviewable PR).
#
# Lockfiles: both trees use Bun's text bun.lock, which Dependabot's npm
# ecosystem reads and updates natively (bun support GA 2025-02). Renovate
# was evaluated as the alternative and not adopted — decision in #216.
#
# Conventions: labels route PRs to the repo's existing triage labels
# (replacing Dependabot's own defaults), and the commit-message prefix
# matches the conventional-commit style (chore = deps/tooling per
# CONTRIBUTING's branch table). Dependabot's branch names
# (dependabot/npm_and_yarn/...) cannot be configured — accepted as-is.
version: 2
updates:
  # ── Root package tree: the app (src/, money paths, auth) ─────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [infra]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          # Security-critical exact pin (ADR 0007) — never silently grouped.
          - next-auth
    ignore:
      # Toolchain-blocked majors (verified 2026-09-20 on true merge results,
      # issue #328): typescript >=7 — typescript-eslint has no TS-7 support
      # yet (typescript-eslint#10940); eslint >=10 — eslint-plugin-react
      # (via eslint-config-next) breaks under eslint 10. The root tree rides
      # the same eslint-config-next parser/plugin stack as the site.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  # ── Marketing site package tree (mjengoos-website/) ──────────────────
  # Grouping deliberately mirrors the root rather than loosening for the
  # lower-risk surface: minor+patch batch, majors individual. The site's
  # framework core IS the app's framework core (next/react/typescript/
  # tailwind) — a major there is a migration in either tree, and migrations
  # are reviewed alone, not inside a weekly batch. The lower-risk profile
  # is honored in triage (CONTRIBUTING "Dependency updates": site gates +
  # a rendered-page look, no finance gate), not in coarser grouping. The
  # one constantly-releasing dep (lucide-react, 0.x) already rides the
  # minor+patch batch: Dependabot classifies 0.x→0.(x+1) steps as minor
  # update-types under its plain semver comparison.
  - package-ecosystem: npm
    directory: /mjengoos-website
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [infra, website]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Toolchain-blocked majors (verified 2026-09-20, issue #328 — the
      # closed #321/#323 carried the exact failure output): typescript >=7
      # fails the site lint gate (typescript-eslint#10940), eslint >=10
      # breaks eslint-plugin-react. Majors arrive as individual PRs, so
      # without these rules every weekly run re-proposes them.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions workflows (.github/workflows/) ────────────────────
  # Actions are pinned by major tag (actions/checkout@v7, oven-sh/
  # setup-bun@v2); this entry keeps those tags current, all severities
  # grouped — an action bump is a one-line diff, and security updates
  # bypass the group anyway.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [infra]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-updates:
        update-types:
          - major
          - minor
          - patch
